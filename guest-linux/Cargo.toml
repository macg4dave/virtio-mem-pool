[package]
name = "rampire-guest-linux"
version = "0.1.0"
edition = "2021"
authors = ["macg4dave"]
license = "GPL-3.0-or-later"
description = "Linux guest service that decides and publishes guest memory requests from /proc telemetry"

[dependencies]
rampire-core = { path = "../crates/rampire-core" }
rampire-guest = { path = "../crates/rampire-guest" }
serde_json = "1.0"
signal-hook = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "rampire-guest"
path = "src/main.rs"

[[bin]]
name = "rampire-workload"
path = "src/bin/rampire-workload.rs"
