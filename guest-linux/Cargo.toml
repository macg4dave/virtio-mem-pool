[package]
name = "virtio-mem-guest-linux"
version = "0.1.0"
edition = "2021"
authors = ["macg4dave"]
license = "GPL-3.0-or-later"
description = "Linux guest service that decides and publishes guest memory requests from /proc telemetry"

[dependencies]
virtio-mem-core = { path = "../crates/virtio-mem-core" }
virtio-mem-guest = { path = "../crates/virtio-mem-guest" }
serde_json = "1.0"
signal-hook = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "virtio-mem-guest"
path = "src/main.rs"

[[bin]]
name = "virtio-mem-workload"
path = "src/bin/virtio-mem-workload.rs"
