# Memory limits for one Windows VM.
#
# This file must be named <VM name>_settings.toml, here windows-vm_settings.toml.
# Lines starting with # are notes: the program ignores them.
#
# Write sizes in quotes, for example "512MB", "128MiB", "3GB" or "1.5GB".
# MB and MiB mean the same here (1 GB = 1024 MB). Use whole GB, or multiples
# of 16 MB. A size that can't be used is reported when you install.
#
# After changing this file, install it (see docs/usage.md). The running
# program does not notice changes on its own.

# The VM's name, exactly as `virsh list` shows it. Don't change it.
vm_name = "windows-vm"

# The smallest this VM is ever made. Memory below this is never taken back.
# Usually the memory the VM starts with.
min_ram = "4GB"

# The largest this VM may ever grow.
max_ram = "16GB"

# Spare memory the VM keeps ready. It asks for more when its spare falls
# below this, and gives memory back when it has more spare than this.
free_ram = "2GB"

# Where the Windows service is installed, and the account it runs as.
# Don't change these.
install_path = 'C:\Program Files\VirtioMemService\virtio-mem-service.exe'
service_account = 'NT AUTHORITY\LocalService'
