[package]
name = "rampire-guest-windows"
version = "0.1.0"
edition = "2021"
authors = ["macg4dave"]
license = "GPL-3.0-or-later"
description = "Windows service that decides and publishes guest memory requests with native telemetry"

[dependencies]
rampire-core = { path = "../crates/rampire-core" }
rampire-guest = { path = "../crates/rampire-guest" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
winapi = { version = "0.3", features = ["fileapi", "ioapiset", "minwinbase", "handleapi", "memoryapi", "psapi", "sddl", "securitybaseapi", "sysinfoapi", "synchapi", "winbase", "winerror", "winnt", "winsvc", "winver"] }

[[bin]]
name = "rampire-guest"
path = "src/main.rs"

[[bin]]
name = "rampire-workload"
path = "src/bin/rampire-workload.rs"
