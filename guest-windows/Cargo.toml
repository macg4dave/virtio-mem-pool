[package]
name = "virtio-mem-guest-windows"
version = "0.1.0"
edition = "2021"
authors = ["macg4dave"]
license = "MIT"
description = "Windows service that decides and publishes guest memory requests with native telemetry"

[dependencies]
virtio-mem-core = { path = "../crates/virtio-mem-core" }
virtio-mem-guest = { path = "../crates/virtio-mem-guest" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
winapi = { version = "0.3", features = ["fileapi", "ioapiset", "minwinbase", "handleapi", "memoryapi", "psapi", "sddl", "securitybaseapi", "sysinfoapi", "synchapi", "winbase", "winerror", "winnt", "winsvc", "winver"] }

[[bin]]
name = "virtio-mem-service"
path = "src/main.rs"

[[bin]]
name = "virtio-mem-workload"
path = "src/bin/virtio-mem-workload.rs"
