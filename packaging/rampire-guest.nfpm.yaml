# The Linux guest package, rampire-guest, as RPM and .deb (roadmap O2.6).
# Built by packaging/build.sh from the repository root, which sets VERSION
# and ARCH. Source paths are relative to the root.
name: rampire-guest
version: "${VERSION}"
arch: "${ARCH}"
platform: linux
maintainer: macg4dave
license: GPL-3.0-or-later
homepage: https://github.com/macg4dave/rampire
description: |
  The guest side of RAMpire: asks the KVM host's RAMpire controller for
  memory when the guest needs more and returns it when the guest has
  spare, over the virtio-serial port org.rampire.control.0 or through
  control files the QEMU guest agent carries.
contents:
  - src: "./target/release/rampire-guest"
    dst: /usr/libexec/rampire-guest
    file_info: { mode: 0755 }
  # The unit with the packaged binary path, written by build.sh.
  - src: "./target/packaging/rampire-guest.service"
    dst: /usr/lib/systemd/system/rampire-guest.service
    file_info: { mode: 0644 }
  - src: "./tools/linux/watch-ram.sh"
    dst: /usr/bin/rampire-watch-ram
    file_info: { mode: 0755 }
  - src: "./LICENSE"
    dst: /usr/share/doc/rampire-guest/LICENSE
    file_info: { mode: 0644 }
scripts:
  postinstall: "./packaging/scripts/guest-postinstall.sh"
  preremove: "./packaging/scripts/guest-preremove.sh"
  postremove: "./packaging/scripts/guest-postremove.sh"
# The unit opens the control channel with OpenFile=, new in systemd 253.
overrides:
  rpm:
    depends:
      - systemd >= 253
  deb:
    depends:
      - systemd (>= 253)
