[package]
name = "rampire-guest"
version = "0.1.0"
edition = "2021"
authors = ["macg4dave"]
license = "GPL-3.0-or-later"
description = "RAMpire guest side of the memory request protocol, shared by the Linux and Windows guest services"

[dependencies]
rampire-core = { path = "../rampire-core" }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winbase"] }
