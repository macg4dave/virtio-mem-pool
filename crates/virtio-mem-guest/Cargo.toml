[package]
name = "virtio-mem-guest"
version = "0.1.0"
edition = "2021"
authors = ["macg4dave"]
license = "GPL-3.0-or-later"
description = "The guest side of the virtio-mem request protocol, shared by the Windows and Linux guest services"

[dependencies]
virtio-mem-core = { path = "../virtio-mem-core" }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winbase"] }
