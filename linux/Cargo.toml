[package]
name = "virtio-mem-linux-service"
version = "0.1.0"
edition = "2021"
authors = ["macg4dave"]
license = "MIT"
description = "Linux guest service that decides and publishes guest memory requests from /proc telemetry"

[dependencies]
virtio-mem-core = { path = "../crates/virtio-mem-core" }
serde_json = "1.0"
signal-hook = "0.3"

[dev-dependencies]
toml = "1.1.8"

[[bin]]
name = "virtio-mem-guest"
path = "src/main.rs"
